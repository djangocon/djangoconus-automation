{% comment %}
One days-out chart. Kept in its own file so the modal can reuse the same markup by
copying the rendered SVG - there is no second rendering path to drift out of sync.
{% endcomment %}
<svg viewBox="0 -14 {{ chart.width|add:64 }} {{ chart.height|add:44 }}"
     class="w-full"
     role="img"
     aria-label="{{ chart.title }} by days out, one line per year">
    <g transform="translate(56, 0)">
        {% for line in chart.gridlines %}
            <line x1="0"
                  y1="{{ line.y|floatformat:1 }}"
                  x2="{{ chart.width }}"
                  y2="{{ line.y|floatformat:1 }}"
                  stroke="#14532d"
                  stroke-width="1" />
            <text x="-10" y="{{ line.y|floatformat:1 }}" dy="4" text-anchor="end" fill="#9ca3af" font-size="11" font-family="monospace">{{ line.label }}</text>
        {% endfor %}

        {% if chart.today %}
            <line x1="{{ chart.today.x|floatformat:1 }}"
                  y1="0"
                  x2="{{ chart.today.x|floatformat:1 }}"
                  y2="{{ chart.height }}"
                  stroke="#e5e7eb"
                  stroke-width="1.5"
                  stroke-dasharray="5 4"
                  opacity="0.75" />
            <text x="{{ chart.today.x|floatformat:1 }}" y="-4" text-anchor="middle" fill="#e5e7eb" font-size="11" font-family="monospace">{{ chart.today.label }}</text>
        {% endif %}

        {% for label in chart.x_labels %}
            <text x="{{ label.x|floatformat:1 }}" y="{{ chart.height|add:18 }}" text-anchor="middle" fill="#9ca3af" font-size="11" font-family="monospace">{{ label.label }}</text>
        {% endfor %}

        {% for line in chart.lines %}
            <polyline points="{{ line.points }}"
                      fill="none"
                      stroke="{{ line.color }}"
                      stroke-width="{% if line.is_current %}3{% else %}2{% endif %}"
                      stroke-linejoin="round"
                      stroke-linecap="round"
                      opacity="{% if line.is_current %}1{% else %}0.75{% endif %}" />
        {% endfor %}

        {% for line in chart.lines %}
            {% for marker in line.markers %}
                {% comment %}
                    Hit target first: the dot is a following sibling so CSS can grow it,
                    and .chart-dot ignores pointer events so hovering the dot still
                    lands on this generous transparent circle.
                {% endcomment %}
                <circle class="chart-hit"
                        cx="{{ marker.x|floatformat:1 }}"
                        cy="{{ marker.y|floatformat:1 }}"
                        r="12"
                        fill="transparent"
                        tabindex="0"
                        role="img"
                        aria-label="{{ marker.label }}"
                        data-point
                        data-year="{{ line.year }}"
                        data-color="{{ line.color }}"
                        data-when="{{ marker.when }}"
                        data-value="{{ marker.value_label }}"></circle>
                <circle class="chart-dot"
                        cx="{{ marker.x|floatformat:1 }}"
                        cy="{{ marker.y|floatformat:1 }}"
                        r="3"
                        fill="{{ line.color }}"
                        opacity="0.9" />
            {% endfor %}
        {% endfor %}
    </g>
</svg>
